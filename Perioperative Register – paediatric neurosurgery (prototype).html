<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perioperative Register – paediatric neurosurgery (prototype)</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#efede7; --text:#1f2421; --muted:#5d665f; --line:#d8d5ca;
  --accent:#1d6b55; --accent-text:#ffffff; --chip:#e1eee8; --chip-text:#14503f;
  --warn-bg:#fff3d1; --warn-text:#664600; --danger:#a63d2a; --danger-bg:#fbe7e2; --ok-bg:#e1eee8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --surface:#1d2320; --surface2:#262d29; --text:#e8ece9; --muted:#9aa59d; --line:#35403a;
    --accent:#4fb596; --accent-text:#0b1511; --chip:#24352e; --chip-text:#a9dcc9;
    --warn-bg:#3b2f10; --warn-text:#f1d792; --danger:#e58a76; --danger-bg:#3d1f19; --ok-bg:#24352e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1d2320; --surface2:#262d29; --text:#e8ece9; --muted:#9aa59d; --line:#35403a;
  --accent:#4fb596; --accent-text:#0b1511; --chip:#24352e; --chip-text:#a9dcc9;
  --warn-bg:#3b2f10; --warn-text:#f1d792; --danger:#e58a76; --danger-bg:#3d1f19; --ok-bg:#24352e;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px 0}
.brand{display:flex;flex-direction:column;padding-bottom:6px}
.brand b{font-size:17px}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;font-size:15px;color:var(--muted);min-height:44px}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.warn{background:var(--warn-bg);color:var(--warn-text);padding:8px 14px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:14px 14px 90px}
h2{font-size:18px;margin:6px 0 10px}
h3{font-size:15px;margin:16px 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fld{margin:0 0 12px}
.fld>label,.lbl{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
.req{color:var(--danger);margin-left:3px}
.tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--surface2);color:var(--muted);border-radius:6px;padding:1px 5px;margin-left:6px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px}
textarea{min-height:76px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600}
.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.seg{display:flex;gap:6px}
.seg button,.chips button{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px}
.seg button.on,.chips button.on{background:var(--chip);color:var(--chip-text);border-color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:6px 11px;min-height:38px;font-size:14px}
.stages{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.stages button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 13px;min-height:40px;font-size:14px;color:var(--text)}
.stages button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted);margin:2px 4px 2px 0}
.pill.g{background:var(--ok-bg);color:var(--chip-text)}
.pill.r{background:var(--danger-bg);color:var(--danger)}
.pill.w{background:var(--warn-bg);color:var(--warn-text)}
.derived{padding:4px 0 6px}
.checks{background:var(--warn-bg);color:var(--warn-text);border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 10px}
.checks ul{margin:4px 0 0 18px;padding:0}
.rec{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rec .meta{font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);position:sticky;top:0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:30}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:16px;max-height:85vh;overflow:auto}
.small{font-size:13px;color:var(--muted)}
ul.plain{margin:6px 0 0 18px;padding:0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Perioperative Register</b><span>Paediatric neurosurgery · prototype v0.2 · aligned to MDAS / HMIS / DHIS2</span></div>
  <nav id="nav"></nav>
</header>
<div class="warn" id="banner">Prototype – use dummy data only until local governance approval is in place. Records stay in this browser on this device. Export regularly.</div>
<main id="app"></main>
<div id="toast" hidden></div>
<div id="modal" hidden></div>

function visible(f,d){return !f.show||f.show(d)}

function derive(r){
 var d=r.data,ev=r.events||[],o={};
 var am=ageMonths(d);o.age_months=am==null?'':Math.round(am*10)/10;
 o.hmis_code=d.procedure||'';o.hmis_group=o.hmis_code.slice(0,2);
 o.muac_class='';
 if(am!=null&&am>=6&&am<60&&d.muac_cm!==undefined&&d.muac_cm!==''){var m=+d.muac_cm;o.muac_class=m<11.5?'severe':m<12.5?'moderate':'none'}
 o.los_days=dd(d.admit_date,d.discharge_date);o.postop_los_days=dd(d.surgery_date,d.discharge_date);
 var cnt=function(c){return ev.filter(function(e){return e.cat===c}).length};
 o.n_events=ev.length;o.n_surgical=cnt('surg');o.n_anaesthetic=cnt('anaes');o.n_recovery=cnt('rec');
 var anyF=function(c,as){return d[as]==='Y'?(cnt(c)>0?'Y':'N'):(cnt(c)>0?'Y':'')};
 o.any_surgical_comp=anyF('surg','assessed_surg');o.any_anaesthetic_comp=anyF('anaes','assessed_anaes');o.any_recovery_comp=anyF('rec','assessed_rec');
 var fl=[o.any_surgical_comp,o.any_anaesthetic_comp,o.any_recovery_comp];
 o.any_complication=fl.indexOf('Y')>=0?'Y':(fl.every(function(x){return x==='N'})?'N':'');
 var gr=ev.map(function(e){return CD.indexOf(e.grade)}).filter(function(i){return i>=0});
 o.max_cd_grade=gr.length?CD[Math.max.apply(null,gr)]:'';
 o.cd_ge_iiia=gr.length?(Math.max.apply(null,gr)>=2?'Y':'N'):(o.any_complication==='N'?'N':'');
 o.rescue_gap_any=ev.some(function(e){return (e.rescue||[]).length})?'Y':(ev.length?'N':'');
 var rec=ev.filter(function(e){return e.cat==='rec'});
 HV.forEach(function(h){o[h[1]]=(d.assessed_rec==='Y'||rec.length)?(rec.some(function(e){return e.type===h[0]})?'Y':'N'):''});
 o.died_inhosp=d.outcome?(d.outcome==='died'?1:0):'';
 o.completeness_pct=completeness(r);
 return o;
}
function checks(r){
 var d=r.data,ev=r.events||[],w=[],am=ageMonths(d);
 if(d.surgery_date&&d.admit_date&&d.surgery_date<d.admit_date)w.push('Surgery date is before admission date.');
 if(d.discharge_date&&d.surgery_date&&d.discharge_date<d.surgery_date)w.push('Discharge date is before surgery date.');
 if(d.t_incision&&d.t_anaes_start&&d.t_incision<d.t_anaes_start)w.push('Incision time is before anaesthesia start (ignore if past midnight).');
 if(d.outcome==='died'&&!d.death_date)w.push('Outcome is death but no date of death.');
 if(ev.some(function(e){return e.grade==='V'})&&d.outcome&&d.outcome!=='died')w.push('A grade V event is logged but outcome is not death.');
 if(ev.some(function(e){return !e.type||!e.grade}))w.push('Some events are missing a type or a Clavien-Dindo grade.');
 if(am!=null&&am>216)w.push('Age is over 18 years. Check units.');
 if(d.weight_kg!==undefined&&d.weight_kg!==''&&(+d.weight_kg<0.5||+d.weight_kg>100))w.push('Weight looks implausible.');
 if(d.temp_min!==undefined&&d.temp_min!==''&&(+d.temp_min<30||+d.temp_min>42))w.push('Lowest temperature looks implausible.');
 if(d.glucose_min!==undefined&&d.glucose_min!==''&&(+d.glucose_min<1||+d.glucose_min>30))w.push('Lowest glucose looks implausible.');
 if(d.care_sufficient==='N'&&ev.length===0&&d.assessed_rec==='Y'&&d.destination==='ward_direct')w.push('Care was insufficient but no event is logged. Fine if intentional.');
 return w;
}

 return rows;
}
var DICT_HEAD=['field_id','label','stage','tier','dhis2_value_type','options_code=label','mdas_table2_equivalent','hvmm_variable','national_form','notes'];
function dictView(){
 var rows=dictRows();
 return '<h2>Data dictionary</h2><p class="small">One source of truth: the forms, the CSV exports and this dictionary are generated from the same schema. Option codes are stable machine codes suitable for DHIS2 option sets. The MDAS column names fields in Table 2 of the Mbale paper.</p><div class="bar"><input id="dfilter" placeholder="Filter fields" style="max-width:260px"><button class="btn sm" data-act="dl-dict">Download CSV</button></div><div class="tablewrap" style="max-height:70vh"><table id="dtable"><tr>'+['Field','Label','Stage','Tier','DHIS2 type','Options','MDAS','HVMM'].map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+
 rows.map(function(r){return '<tr><td><code>'+esc(r[0])+'</code></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td><td>'+esc(r[5])+'</td><td>'+esc(r[6])+'</td><td>'+esc(r[7])+'</td></tr>'}).join('')+'</table></div>';
}
function dataView(){
 return '<h2>Data</h2>'+
 '<div class="card"><h3 style="margin-top:0">Export</h3><div class="bar"><button class="btn" data-act="dl-rec">Records CSV</button><button class="btn" data-act="dl-ev">Events CSV</button><button class="btn" data-act="dl-hmis">Monthly HMIS-style CSV</button><button class="btn sec" data-act="dl-dict">Dictionary CSV</button><button class="btn sec" data-act="dl-json">Backup JSON</button></div>'+
 '<label class="small"><input type="checkbox" id="inclhosp" style="width:auto;min-height:0" '+(S.inclHosp?'checked':'')+'> Include hospital number in exports (off by default)</label></div>'+
 '<div class="card"><h3 style="margin-top:0">Import backup</h3><textarea id="impjson" placeholder="Paste a backup JSON here"></textarea><div class="bar" style="margin-top:8px"><button class="btn sec" data-act="imp">Import pasted JSON</button><input type="file" id="impfile" accept=".json,application/json" style="max-width:260px"></div></div>'+
 '<div class="card"><h3 style="margin-top:0">Testing</h3><div class="bar"><button class="btn sec" data-act="dummy">Load 8 dummy records</button><button class="btn danger" data-act="wipe">Delete all records</button></div><div class="small">Dummy records are randomly generated and clearly labelled DUMMY.</div></div>'+
 '<div class="card"><h3 style="margin-top:0">Using this on an iPad</h3><ul class="plain small"><li>Open the page in Safari, then Share → Add to Home Screen.</li><li>Data is held in the browser on that device only. Clearing website data deletes it. Export after every session.</li><li>Test offline behaviour before relying on it: load the page once online, switch to airplane mode, reopen from the home screen.</li><li>Do not enter real patient data until the hospital’s governance team has agreed where it may be stored.</li></ul></div>';
}

/* ---------- export ---------- */
function csvCell(v){v=v==null?'':Array.isArray(v)?v.join('|'):String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(head,rows){return [head.map(csvCell).join(',')].concat(rows.map(function(r){return r.map(csvCell).join(',')})).join('\r\n')}
var DER=['age_months','hmis_code','hmis_group','muac_class','los_days','postop_los_days','n_events','n_surgical','n_anaesthetic','n_recovery','any_surgical_comp','any_anaesthetic_comp','any_recovery_comp','any_complication','max_cd_grade','cd_ge_iiia','rescue_gap_any'].concat(HV.map(function(h){return h[1]}),['died_inhosp','completeness_pct']);
function recCSV(){
 var fields=ALLF.filter(function(f){return S.inclHosp||f.id!=='hosp_no'});
 var head=['record_id','specialty'].concat(fields.map(function(f){return f.id}),DER);
 var rows=DB.records.map(function(r){var o=derive(r);return [r.id,'Neurosurgery'].concat(fields.map(function(f){return r.data[f.id]}),DER.map(function(k){return o[k]}))});
 return toCSV(head,rows);
}
function evCSV(){
 var head=['record_id','event_no','ev_category','ev_type','ev_phase','ev_grade','ev_treatment','ev_rescue_gap','ev_outcome'];
 var rows=[];DB.records.forEach(function(r){(r.events||[]).forEach(function(e,i){rows.push([r.id,i+1,e.cat,e.type,e.phase,e.grade,e.tx,e.rescue||[],e.outcome])})});
 return toCSV(head,rows);
}
function hmisCSV(){
 var g={};DB.records.forEach(function(r){var d=r.data,m=(d.surgery_date||'').slice(0,7);if(!m||!d.procedure)return;var k=m+'|'+d.procedure;g[k]=g[k]||{n:0,e:0,x:0};g[k].n++;if(d.urgency==='emergency')g[k].e++;if(d.outcome==='died')g[k].x++});
 var rows=Object.keys(g).sort().map(function(k){var p=k.split('|');return [p[0],p[1],PROC[p[1]]||'',g[k].n,g[k].e,g[k].x]});
 return toCSV(['month','hmis_code','procedure','operations','emergency','in_hospital_deaths'],rows);
}
function dictCSV(){return toCSV(DICT_HEAD,dictRows())}
async function exportFile(name,text){
 var dl=null;
 try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){dl=null}
 if(dl){
  try{await dl.save({filename:name,data:text});toast('Saved '+name);return}
  catch(err){if(err&&err.code==='declined')return}
 }
 modal('<b>'+esc(name)+'</b><p class="small">Direct download is not available here. Select all, copy, and paste into a file or an email to yourself.</p><textarea id="expta" readonly style="min-height:200px">'+esc(text)+'</textarea><div class="bar" style="margin-top:8px"><button class="btn" data-act="closemodal">Close</button></div>');
 var ta=$('#expta');if(ta){ta.focus();ta.select()}
}

/* ---------- dummy data ---------- */
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function rnd(a,b){return Math.round((a+Math.random()*(b-a))*10)/10}
function dummy(){
 for(var i=0;i<8;i++){
  var days=Math.floor(Math.random()*120), base=new Date(Date.now()-days*864e5), adm=base.toISOString().slice(0,10), sur=new Date(base.getTime()+864e5).toISOString().slice(0,10), dis=new Date(base.getTime()+(3+Math.floor(Math.random()*8))*864e5).toISOString().slice(0,10);
  var proc=pick(['NS05','NS09','NS09','NS06','NS01','NS07']);
  var r={id:newId(),created:Date.now(),updated:Date.now()-i,data:{
   hosp_no:'DUMMY-'+(100+i),enrol_date:adm,sex:pick(['F','M']),age_value:String(Math.floor(2+Math.random()*30)),age_unit:'months',weight_kg:String(rnd(4,14)),district:'Dummy',referral:pick(['self','health_centre','satellite']),
   admit_date:adm,comorbid:[pick(['none','malnutrition','anaemia','infection'])],hb_gdl:String(rnd(7,13)),asa:pick(['II','II','III']),
   dx:pick(['pih','hc_other','mmc','mmc_hc','tumour']),urgency:pick(['elective','elective','emergency']),surgery_date:sur,procedure:proc,severity:pick(['intermediate','major']),surgeon_cat:'consultant',
   anaes_tech:pick(['ga_ett','ga_ett','ga_sga']),anaes_cat:pick(['anaesthesiologist','anaes_officer']),blood_given:pick(['Y','N','N']),destination:pick(['picu','hdu','recovery_ward']),care_sufficient:pick(['Y','Y','Y','N']),
   assessed_surg:'Y',assessed_anaes:'Y',assessed_rec:'Y',unplanned_icu:'N',reop:'N',discharge_date:dis,outcome:pick(['alive','alive','alive','alive','alive','died'])},events:[]};
  if(Math.random()<.5)r.events.push({cat:'rec',type:pick(['hypothermia','vomiting','pain','resp_distress','hypoglycaemia']),phase:'recovery',grade:pick(['I','II','II','IIIa','IVa']),tx:'',rescue:[],outcome:'resolved'});
  if(Math.random()<.2)r.events.push({cat:'surg',type:pick(['csf_leak','wound_infection']),phase:'ward',grade:pick(['II','IIIb']),tx:'',rescue:[],outcome:'resolved'});
  if(r.data.outcome==='died'){r.data.death_date=dis;r.data.cause_death=pick(['sepsis','raised_icp']);r.events.push({cat:'rec',type:'resp_distress',phase:'icu',grade:'V',tx:'',rescue:[pick(['vent','icu_bed'])],outcome:'died'})}
  DB.records.push(r);
 }
 persist();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var t=e.target.closest('button,[data-go],[data-stage]');if(!t)return;
 if(t.dataset.go){if(cur)persist();view=t.dataset.go;render();return}
 if(t.dataset.stage){stage=t.dataset.stage;render();return}
 var act=t.dataset.act;
 if(act==='new'){cur={id:newId(),created:Date.now(),updated:Date.now(),data:{enrol_date:TODAY},events:[]};DB.records.push(cur);persist();stage='reserve';view='form';render();return}
 if(act==='open'){cur=byId(t.dataset.id);stage='reserve';view='form';render();return}
 if(act==='del'){var id=t.dataset.id;modal('<b>Delete '+esc(id)+'?</b><p class="small">This cannot be undone. Export first if you need a copy.</p><div class="bar"><button class="btn danger" data-act="delok" data-id="'+esc(id)+'">Delete</button><button class="btn sec" data-act="closemodal">Cancel</button></div>');return}
 if(act==='delok'){DB.records=DB.records.filter(function(r){return r.id!==t.dataset.id});if(cur&&cur.id===t.dataset.id)cur=null;persist();closeModal();render();return}
 if(act==='closemodal'){closeModal();return}
 if(act==='evadd'){cur.events.push({cat:t.dataset.c,type:'',phase:'',grade:'',tx:'',rescue:[],outcome:''});touch();$('#evlist').innerHTML=cur.events.map(eventCard).join('');return}
 if(act==='evdel'){var i=+t.closest('.ev').dataset.i;cur.events.splice(i,1);touch();$('#evlist').innerHTML=cur.events.map(eventCard).join('');return}
 if(act==='dl-rec')return exportFile('register_records_'+TODAY+'.csv',recCSV());
 if(act==='dl-ev')return exportFile('register_events_'+TODAY+'.csv',evCSV());
 if(act==='dl-hmis')return exportFile('register_monthly_hmis_style_'+TODAY+'.csv',hmisCSV());
 if(act==='dl-dict')return exportFile('register_data_dictionary.csv',dictCSV());
 if(act==='dl-json')return exportFile('register_backup_'+TODAY+'.json',JSON.stringify({version:2,exported:new Date().toISOString(),records:DB.records}));
 if(act==='imp'){doImport($('#impjson').value);return}
 if(act==='dummy'){dummy();toast('8 dummy records added');return}
 if(act==='wipe'){modal('<b>Delete all records?</b><p class="small">This removes everything stored in this browser.</p><div class="bar"><button class="btn danger" data-act="wipeok">Delete all</button><button class="btn sec" data-act="closemodal">Cancel</button></div>');return}
 if(act==='wipeok'){DB.records=[];cur=null;persist();closeModal();render();return}
 /* segmented / chips */
 var host=t.closest('[data-f],[data-e]');
 if(host&&(host.dataset.t==='yesno'||host.dataset.t==='multi')){
  var v=t.dataset.v;
  if(host.dataset.f){
   var id2=host.dataset.f;
   if(host.dataset.t==='yesno'){cur.data[id2]=cur.data[id2]===v?'':v}
   else{var a=Array.isArray(cur.data[id2])?cur.data[id2].slice():[];var k=a.indexOf(v);if(k>=0)a.splice(k,1);else{a.push(v)}
    if(id2==='comorbid'){if(v==='none'&&a.indexOf('none')>=0)a=['none'];else a=a.filter(function(x){return x!=='none'})}
    cur.data[id2]=a}
   $$('button',host).forEach(function(b){var val=cur.data[id2];b.classList.toggle('on',Array.isArray(val)?val.indexOf(b.dataset.v)>=0:val===b.dataset.v)});
  }else{
   var ev=cur.events[+host.closest('.ev').dataset.i];var a2=(ev.rescue||[]).slice();var k2=a2.indexOf(v);if(k2>=0)a2.splice(k2,1);else a2.push(v);ev.rescue=a2;
   t.classList.toggle('on');
  }
  touch();
 }
});
function touch(){cur.updated=Date.now();persistSoon();refresh()}
function refresh(){
 var d=$('#derived');if(d)d.innerHTML=derivedHTML(cur);
 $$('[data-fw]').forEach(function(w){var f=FIELDS[w.dataset.fw];if(f)w.hidden=!visible(f,cur.data)});
}
function onField(e){
 var t=e.target;
 if(t.id==='tier'){S.tier=t.value;saveSettings();render();return}
 if(t.id==='inclhosp'){S.inclHosp=t.checked;saveSettings();return}
 if(t.id==='dfilter'){var q=t.value.toLowerCase();$$('#dtable tr').forEach(function(tr,i){if(i===0)return;tr.hidden=q&&tr.textContent.toLowerCase().indexOf(q)<0});return}
 if(!cur)return;
 if(t.dataset.f&&(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')&&!t.closest('[data-t]')){cur.data[t.dataset.f]=t.value;touch();return}
 if(t.dataset.e!==undefined&&t.tagName!=='BUTTON'){
  var card=t.closest('.ev');if(!card)return;var ev=cur.events[+card.dataset.i];
  ev[t.dataset.e]=t.value;
  if(t.dataset.e==='cat'){ev.type='';touch();$('#evlist').innerHTML=cur.events.map(eventCard).join('');return}
  touch();
 }
}
document.addEventListener('input',onField);
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='impfile'&&t.files&&t.files[0]){var fr=new FileReader();fr.onload=function(){doImport(String(fr.result))};fr.readAsText(t.files[0]);return}
 if(t.tagName==='SELECT'||t.type==='checkbox')onField(e);
});
function doImport(txt){
 try{
  var j=JSON.parse(txt);var rs=Array.isArray(j)?j:j.records;if(!Array.isArray(rs))throw new Error('no records');
  var n=0;rs.forEach(function(r){if(!r||!r.id||!r.data)return;var ex=byId(r.id);if(!ex){DB.records.push(r);n++}else if((r.updated||0)>(ex.updated||0)){Object.assign(ex,r);n++}});
  persist();toast('Imported '+n+' record(s)');view='list';render();
 }catch(err){toast('Could not read that JSON')}
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

banner();
render();
})();
</script>
